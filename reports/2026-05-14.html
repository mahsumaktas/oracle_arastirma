d\udcc4 KAT-3 \u00b7 Makaleler & Ara\u015ft\u0131rma\n\n| arXiv ID | Ba\u015fl\u0131k | Neden \u00d6nemli | Kaynak |\n|----------|--------|--------------|--------|\n| 2605.12481 | ToolCUA | GUI + API/tool hybrid agent training i\u00e7in do\u011frudan uygulanabilir SOTA sinyali. | [\ud83d\udd17](https://huggingface.co/papers/2605.12481) |\n| 2605.09530 | MemPrivacy | Oracle/Hachi tarz\u0131 persistent memory sistemlerinde PII\u2019yi cloud\u2019a ham g\u00f6ndermeden memory utility koruma fikri. | [\ud83d\udd17](https://huggingface.co/papers/2605.09530) |\n| 2605.12460 | Multi-Stream LLMs | Agent loop\u2019un tek-token/tek-stream darbo\u011faz\u0131n\u0131 mimari olarak k\u0131rmay\u0131 \u00f6neriyor. | [\ud83d\udd17](https://huggingface.co/papers/2605.12460) |\n| 2605.11882 | On-Policy Self-Evolution via Failure Trajectories | Ba\u015far\u0131s\u0131z trajectory\u2019yi safety/utility repair datas\u0131na \u00e7eviriyor. | [\ud83d\udd17](https://huggingface.co/papers/2605.11882) |\n| 2605.09131 | MCP-Cosmos | MCP execution kalite metrikleri ve world-model destekli agent denemesi. | [\ud83d\udd17](https://arxiv.org/abs/2605.09131) |\n| 2605.00080 | World Model for Robot Learning | Robot policy/planning/simulation i\u00e7in world-model literat\u00fcr\u00fcn\u00fc toparl\u0131yor. | [\ud83d\udd17](https://huggingface.co/papers/2605.00080) |\n| 2605.10653 | Embodied AI in Action | SAE World Congress 2026\u2019den real-world robotics safety/trust/deployment notlar\u0131. | [\ud83d\udd17](https://arxiv.org/abs/2605.10653) |\n\n**Oracle i\u00e7in \u00e7\u0131kar\u0131m:** Memory privacy + failure-trajectory repair + GUI/tool path se\u00e7imi do\u011frudan Hachi\u2019nin cron, browser ve shell orchestration g\u00fcvenli\u011fine uygulanabilir.\n\n---\n\n## \ud83e\udde0 KAT-4 \u00b7 D\u00fc\u015f\u00fcnce Liderleri\n\n| Ki\u015fi | G\u00f6r\u00fc\u015f \u00d6zeti | Tarih | Kaynak |\n|------|-------------|-------|--------|\n| Simon Willison | \u201c11 AI agents\u201d ifadesi
